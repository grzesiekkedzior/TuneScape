name: qmake build and QtTest

on:
  push:
    branches:
      - refactor/codebase-audit
  pull_request:

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Select Python for aqtinstall
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
          architecture: x64

      - name: Verify installer Python
        shell: pwsh
        run: |
          python --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import sys; assert sys.version_info[:3] == (3, 12, 10), sys.version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Qt 6.12 and MinGW 15.1
        uses: jurplel/install-qt-action@v4
        with:
          setup-python: false
          # aqt 3.3.0 selects a nonexistent repository for Qt >= 6.8 MinGW.
          # Pin the verified upstream fix until a release includes it.
          aqtsource: "https://github.com/miurahr/aqtinstall/archive/5a49f2b391ae8ee1d3c0dd87f8b33c1d49a4deb7.tar.gz"
          py7zrversion: "==1.1.3"
          version: "6.12.0"
          arch: win64_mingw
          modules: qtmultimedia
          tools: tools_mingw1510,qt.tools.win64_mingw1510

      - name: Select and verify compiler
        shell: pwsh
        run: |
          $compiler = (Resolve-Path "$env:QT_ROOT_DIR/../../Tools/mingw1510_64/bin").Path
          $compiler | Out-File $env:GITHUB_PATH -Append
          "COMPILER_BIN=$compiler" | Out-File $env:GITHUB_ENV -Append
          Write-Host "Qt: $env:QT_ROOT_DIR; compiler: $compiler"
          if ((& "$compiler/g++.exe" -dumpfullversion) -ne '15.1.0') { throw 'Expected GCC 15.1.0' }
          if ((& "$compiler/g++.exe" -dumpmachine) -ne 'x86_64-w64-mingw32') { throw 'Expected MinGW x64' }
          if ((& "$env:QT_ROOT_DIR/bin/qmake.exe" -query QT_VERSION) -ne '6.12.0') { throw 'Expected Qt 6.12.0' }

      - name: Build with qmake
        shell: pwsh
        run: |
          & "$env:QT_ROOT_DIR/bin/qmake.exe" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          g++ -dumpfullversion
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path build | Out-Null
          Set-Location build
          & "$env:QT_ROOT_DIR/bin/qmake.exe" ../TuneScape.pro 'CONFIG+=release'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mingw32-make -j4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run QtTest
        shell: pwsh
        run: |
          $env:TUNESCAPE_TEST_MEDIA = '0'
          $p = Start-Process -FilePath .\build\TuneScapeTests\release\TuneScapeTests.exe -ArgumentList '-o','qttest.txt,txt' -WindowStyle Hidden -PassThru
          if (!$p.WaitForExit(120000)) { $p.Kill(); throw 'QtTest timeout' }
          Get-Content qttest.txt
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }

      - name: Build CMake and run CTest
        shell: pwsh
        run: |
          cmake -S . -B build-cmake -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" "-DCMAKE_CXX_COMPILER=$env:COMPILER_BIN/g++.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-cmake --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:TUNESCAPE_TEST_MEDIA = '0'
          ctest --test-dir build-cmake --output-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Windows deployment
        shell: pwsh
        run: |
          ./tools/windows/deploy.ps1 -QtRoot $env:QT_ROOT_DIR -CompilerBin $env:COMPILER_BIN -Executable ./build/TuneScapeCore/release/TuneScapeCore.exe -OutputDirectory "$env:RUNNER_TEMP/TuneScape-dist"

      - name: Preserve test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-logs
          path: |
            **/aqtinstall.log
            qttest.txt
            build-cmake/Testing/Temporary/
            ${{ runner.temp }}/TuneScape-dist/deployment-manifest.json

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TUNESCAPE_TEST_MEDIA: "0"
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt and GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make cmake ninja-build qmake6 qt6-base-dev qt6-multimedia-dev qt6-svg-dev qt6-qpa-plugins

      - name: Build with qmake
        shell: bash
        run: |
          qmake6 -v | tee linux-environment.txt
          g++ --version | tee -a linux-environment.txt
          cat /etc/os-release | tee -a linux-environment.txt
          mkdir build
          cd build
          qmake6 ../TuneScape.pro CONFIG+=release 2>&1 | tee ../linux-qmake-configure.txt
          make -j4 2>&1 | tee ../linux-qmake-build.txt

      - name: Run QtTest
        shell: bash
        run: ./build/TuneScapeTests/TuneScapeTests -o -,txt -o linux-qttest.xml,junitxml

      - name: Build CMake and run CTest
        shell: bash
        run: |
          cmake -S . -B build-cmake -G Ninja -DCMAKE_BUILD_TYPE=Release 2>&1 | tee linux-cmake-configure.txt
          cmake --build build-cmake --parallel 4 2>&1 | tee linux-cmake-build.txt
          ctest --test-dir build-cmake --output-on-failure --no-tests=error --output-junit "$GITHUB_WORKSPACE/linux-ctest.xml"

      - name: Preserve Linux build and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-and-test-logs
          path: |
            linux-*.txt
            linux-*.xml
            build-cmake/Testing/Temporary/
